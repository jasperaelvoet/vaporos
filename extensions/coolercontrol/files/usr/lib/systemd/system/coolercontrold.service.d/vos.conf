# VaporOS: coolercontrold as an extension (docs/CONTRACTS.md "Extensions",
# CoolerControl). Its files live in the extension's system data area, its
# server answers on loopback only (vosd serves the web UI on :11987 to the
# local network, signed in), and every fan goes back to the mode it had
# before CoolerControl whenever the daemon stops, however it stops.

[Service]
Environment=CC_CONFIG_DIR=/var/lib/vos/ext/data/coolercontrol/config
Environment=CC_DATA_DIR=/var/lib/vos/ext/data/coolercontrol/data
# Empty and read-only: no plugin runs as root.
Environment=CC_PLUGINS_DIR=/usr/lib/vos/ext/coolercontrol/plugins
Environment=CC_HOST_IP4=127.0.0.1
Environment=CC_HOST_IP6=::1
Environment=CC_PORT=11986
# OFF (or 0) turns TLS off; "false" would turn it on.
Environment=CC_TLS=OFF
Environment=CC_SERVICE_MANAGER=OFF

StateDirectory=vos/ext/data/coolercontrol
RuntimeDirectory=coolercontrold
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ReadWritePaths=/var/lib/vos/ext/data/coolercontrol
NoExecPaths=/var /run /tmp
ExecPaths=/usr
# No ProtectKernelTunables=, ProtectKernelModules= or PrivateDevices=: it
# writes hwmon and amdgpu files in /sys, reads /dev/port and hidraw devices,
# and loads sensor drivers.
#
# Capabilities, each for one job (verify on hardware: a missing one shows
# as a sensor or fan CoolerControl cannot read or set):
#   CAP_SYS_MODULE       `detect --load` loads the sensor drivers it finds (it87, nct6775, drivetemp, ...)
#   CAP_SYS_RAWIO        Super I/O chip detection reads I/O ports through /dev/port
#   CAP_DAC_OVERRIDE     writes device nodes and /sys files root does not own (hidraw nodes udev hands to a group)
#   CAP_DAC_READ_SEARCH  reads sensor and /proc files whose mode leaves root out
#   CAP_FOWNER           sets the mode of files it did not create (its settings after a restore)
#   CAP_CHOWN            keeps the files it rewrites root's
#   CAP_SYS_NICE         raises its own priority, so fan control keeps up under load
# Not CAP_SYS_ADMIN.
CapabilityBoundingSet=CAP_SYS_MODULE CAP_SYS_RAWIO CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_FOWNER CAP_CHOWN CAP_SYS_NICE

# Finite, as every extension service's; upstream's own 300 s, which slow
# device detection needs.
TimeoutStartSec=300s

# The VaporOS admin password, a backup before a new version's first start,
# the settings vosd's proxy needs. It fails when there is no password, so
# the daemon never runs with its default one.
ExecStartPre=/usr/bin/vos ext coolercontrol prepare
ExecStartPre=/usr/bin/coolercontrold detect --load
# "+": outside the sandbox, to keep each fan's first mode in /run/vos.
ExecStartPre=+/usr/bin/vos ext coolercontrol fans snapshot
ExecStopPost=+/usr/bin/vos ext coolercontrol fans restore
