# Build the website (website/, Astro) and deploy it to GitHub Pages at
# https://jasperaelvoet.github.io/vaporos/.
#
#   build     npm ci and astro build; the download card reads the latest
#             release from the GitHub API at build time
#   deploy    publishes website/dist through actions/deploy-pages
#
# Releases that build.yml creates with GITHUB_TOKEN fire no other workflows,
# and a `release` run would carry a tag ref, which the github-pages
# environment refuses by default. So there is no release trigger: the daily
# run keeps the build-time release data fresh, and the page also refreshes it
# in the browser. Only main deploys (the environment allows only the default
# branch); a manual run from another branch builds but does not deploy.
#
# One-time setup: Pages must be enabled with the Actions source before the
# first run, or configure-pages fails:
#   gh api -X POST repos/jasperaelvoet/vaporos/pages -f build_type=workflow
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'keys/release.pub'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# One deployment at a time; a running deployment is never cut off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          # For the release lookup: authenticated requests are not rate-limited
          # like anonymous ones.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
