# Check, build and (by hand only) deploy the website (website/, Next.js
# static export) to GitHub Pages at https://jasperaelvoet.github.io/vaporos/.
#
# Pre-launch shape: the Next.js site replaces the Astro one while the redesign
# is under way, so nothing here deploys by itself.
#
#   check     every push and pull request that touches website/**: npm ci,
#             then lint, typecheck and unit tests (npm run check)
#   build     main only: the static export in website/out, uploaded as the
#             Pages artifact; the download card reads the latest release from
#             the GitHub API at build time
#   deploy    only a manual run (workflow_dispatch) on main publishes it
#
# There is no schedule and no deploy on push until the site launches. Only
# main deploys (the github-pages environment allows only the default branch);
# a manual run from another branch checks but neither builds nor deploys.
#
# One-time setup: Pages must be enabled with the Actions source before the
# first deploy, or configure-pages fails:
#   gh api -X POST repos/jasperaelvoet/vaporos/pages -f build_type=workflow
name: pages

on:
  push:
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One run per ref at a time; a newer pull request push replaces an older check.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: website

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint, typecheck and unit tests
        run: npm run check

  build:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          # For the release lookup: authenticated requests are not rate-limited
          # like anonymous ones.
          GITHUB_TOKEN: ${{ github.token }}
          # A lookup that fails fails the build, so a degraded download card
          # is never uploaded.
          VAPOROS_RELEASE_REQUIRED: '1'
          VAPOROS_SITE_COMMIT: ${{ github.sha }}
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deployment at a time; a running deployment is never cut off halfway.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
