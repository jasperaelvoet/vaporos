# Build, check and deploy the website (website/, Next.js static export) to
# GitHub Pages at https://jasperaelvoet.github.io/vaporos/.
#
# When it runs (main only: the github-pages environment allows only main):
#
#   push           a push to main that touches the site or what it is built
#                  from (the site, the release key, the design tokens and
#                  fonts, the control center it describes, the TV screen)
#   workflow_run   after every successful `build` run on main: the OS release
#                  it published is what the download card shows
#   schedule       daily, so the download card follows releases published by
#                  hand or by a re-run
#   dispatch       by hand
#
# The deploy gate: a push whose changes are all ones build.yml ignores
# (website/**, **.md, .claude/**, tools/**, pages.yml, web.yml: keep the list
# in step with build.yml's paths-ignore) deploys straight away. A push that
# also changes the OS, or whose range can't be read (a new branch, a forced
# push), only checks: the site deploys from the workflow_run once build.yml
# has passed and released, so the site never describes an OS that isn't out.
# A workflow_run for a commit that is no longer main's tip leaves the deploy to
# the newer run. Never use [skip ci] for website commits: it skips this too.
#
# The build job: generated files are fresh (tokens, fonts), the control
# center's UI strings for the [[label]] check, the files the site takes from
# the code that makes them (neither is committed: the TV stills, rendered by
# the welcome screen's own code, and, while src/content/demo.ts has
# `enabled: true`, the live demo, the control center exported onto made-up
# data), lint, typecheck and unit tests, the static export with a strict
# release lookup (a failed lookup fails the build, so a degraded download
# card is never deployed and the last good deploy stays live) that also
# fails without the stills or the demo it should have, the size budgets, and
# the headless e2e gates (tests/e2e/ci.mjs: static checks, metadata,
# screenshots at 1440/768/390 and reduced motion with zero console errors
# and no overflow, axe; and with the demo on, tests/e2e/demo.mjs: its
# scenarios, no requests to /api/v1, no CSP violations, the phone layout,
# the fallback, screenshots and axe on /demo/).
#
# One-time setup: Pages must use the Actions source before the first deploy:
#   gh api -X POST repos/jasperaelvoet/vaporos/pages -f build_type=workflow
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'keys/release.pub'
      - 'design/**'
      - 'internal/web/**'
      - 'internal/display/welcome/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# One run at a time, in order; a deployment is never cut off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: website

jobs:
  build:
    # A failed OS build deploys nothing.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    env:
      SITE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy gate
        id: gate
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          deploy=true
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            deploy=false; echo "::notice::Only main deploys; this run only checks."
          fi
          if [ "$EVENT" = push ]; then
            # Changes build.yml ignores; anything else builds and releases the OS first.
            site_only='^(website/|\.claude/|tools/|\.github/workflows/(pages|web)\.yml$)|\.md$'
            if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
               || ! changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null); then
              deploy=false; echo "::notice::The push range can't be read; the site deploys after build.yml passes."
            elif printf '%s\n' "$changed" | grep -vqE "$site_only"; then
              deploy=false; echo "::notice::This push changes the OS too; the site deploys after build.yml passes."
            fi
          fi
          if [ "$EVENT" = workflow_run ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            deploy=false; echo "::notice::main moved on; the newer run deploys."
          fi
          echo "deploy=$deploy" >>"$GITHUB_OUTPUT"
          echo "deploy=$deploy"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Generated design files are fresh
        working-directory: .
        run: go test -count=1 ./internal/brand -run 'TestDesignOutputsFresh|TestTokens'

      - name: The control center's UI strings (for the [[label]] check)
        working-directory: .
        run: VOS_WEB_EXPORT_STRINGS="$PWD/website/tests/fixtures" go test -count=1 ./internal/web -run TestExportStrings

      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      # src/content/demo.ts `enabled` turns the live demo on: its export goes
      # into public/demo/ui, the build must find it, its e2e gate runs, and
      # the installed system's TV stills' QR codes open /demo/ instead of the
      # site's home page (the installer's stills open /install/ either way).
      - name: Demo flag
        id: demo
        run: |
          enabled=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --input-type=module \
            -e "const { demo } = await import('./src/content/demo.ts'); console.log(demo.enabled === true)")
          echo "enabled=$enabled" >>"$GITHUB_OUTPUT"
          echo "live demo on: $enabled"

      - name: The live demo (the control center on made-up data)
        if: steps.demo.outputs.enabled == 'true'
        working-directory: .
        run: VOS_WEB_EXPORT="$PWD/website/public/demo/ui" go test -count=1 ./internal/web -run 'TestExportDemo$'

      - name: The TV stills (the welcome screen, rendered by its own code)
        working-directory: .
        env:
          QR: ${{ steps.demo.outputs.enabled == 'true' && 'https://jasperaelvoet.github.io/vaporos/demo/' || 'https://jasperaelvoet.github.io/vaporos/' }}
        run: VOS_WELCOME_STILLS="$PWD/website/public/tv" VOS_WELCOME_STILLS_QR="$QR" go test -count=1 ./internal/display/welcome -run 'TestExportStills$'

      - uses: actions/cache@v6
        with:
          path: website/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('website/package-lock.json') }}-${{ hashFiles('website/src/**', 'website/public/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('website/package-lock.json') }}-

      - name: Install
        run: npm ci

      - name: Lint, typecheck and unit tests
        run: npm run check

      - name: Build
        env:
          # Authenticated release lookups are not rate-limited like anonymous ones.
          GITHUB_TOKEN: ${{ github.token }}
          # A lookup that fails fails the build: never deploy a degraded download card.
          VAPOROS_RELEASE_REQUIRED: '1'
          # <meta name="vaporos-commit">: what the live site was built from.
          VAPOROS_SITE_COMMIT: ${{ env.SITE_SHA }}
          # The steps above wrote them: a build without them fails instead of
          # deploying the drawn screens or a demo page with no demo.
          VAPOROS_STILLS_REQUIRED: '1'
          VAPOROS_DEMO_REQUIRED: ${{ steps.demo.outputs.enabled == 'true' && '1' || '0' }}
        run: npm run build

      - name: Size budgets
        run: node scripts/budget.mjs out

      - name: Headless browser
        run: npx --no-install playwright-core install --with-deps --only-shell chromium

      - name: e2e (static checks, metadata, screenshots, axe)
        run: node tests/e2e/ci.mjs out --report="$RUNNER_TEMP/site-e2e" --commit="$SITE_SHA"

      - name: e2e of the live demo (scenarios, no /api/v1 requests, CSP, phones, axe)
        if: steps.demo.outputs.enabled == 'true'
        run: node tests/e2e/demo.mjs out --report="$RUNNER_TEMP/site-e2e/demo"

      - name: Keep the e2e report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: site-e2e
          path: ${{ runner.temp }}/site-e2e
          retention-days: 7

      - uses: actions/configure-pages@v6
        if: steps.gate.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.deploy == 'true'
        with:
          path: website/out

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
