# Build, test and publish VaporOS on every push.
#
#   go        gofmt, vet, race-enabled unit tests, the static `vos` binary
#   image     the OS (root.erofs, kernel, initramfs, manifest.json) and the
#             ISO, built by build/build.sh in the same container as the dev loop.
#             On pushes build.sh signs manifest.json with the VOS_SIGNING_KEY
#             secret before it makes the ISO, so the ISO carries
#             manifest.json.sig: the installer refuses an unsigned medium.
#             Pull requests never get the key, and their builds stay unsigned.
#   vm-test   installs the ISO in QEMU through the web installer and boots it
#             (an unsigned ISO: checks that its installer refuses to install it)
#   publish   signed pushes only: checks the image job's signed manifest against
#             keys/release.pub, pushes the OS to ghcr.io as an OCI artifact
#             tagged <version> and <channel>, and attaches the ISO to a GitHub
#             release (main: latest; other branches: prerelease)
#
# The version is the commit's UTC time (YYYYMMDD.HHMMSS), so every job and
# every re-run of a commit agree on it. The channel is the branch name, which
# is also the OCI tag installed machines on that branch follow.
name: build

# The website and the docs have their own workflow (pages.yml): changes that
# touch only them neither build nor release the OS.
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'website/**'
      - '**.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths-ignore:
      - 'website/**'
      - '**.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One run per branch or PR at a time. A new push to a PR replaces the running
# build; pushes to a branch queue, so releases are published in order.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Version and channel
        id: meta
        run: |
          version=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y%m%d.%H%M%S)
          # The branch as an OCI tag: [A-Za-z0-9_][A-Za-z0-9._-]{0,127}.
          # A PR builds for its head branch (but never publishes).
          ref=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          channel=$(printf '%s' "$ref" | tr -c 'A-Za-z0-9._-' '-' | sed -E 's/^[.-]+//' | cut -c1-128)
          [ -n "$channel" ] || channel=unnamed
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "channel=$channel" >>"$GITHUB_OUTPUT"
          echo "### VaporOS $version (channel \`$channel\`)" >>"$GITHUB_STEP_SUMMARY"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            for f in $unformatted; do echo "::error file=$f::not formatted with gofmt"; done
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: Build vos
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v3
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION -X main.commit=$GITHUB_SHA" \
            -o .build/vos ./cmd/vos
          file .build/vos
          if ! file .build/vos | grep -q 'statically linked'; then
            echo "::error::.build/vos is not a static binary"
            exit 1
          fi
          have=$(.build/vos version)
          if [ "$have" != "$VERSION" ]; then
            echo "::error::'vos version' prints '$have', expected $VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vos
          path: .build/vos
          # .build is a dot directory, which counts as hidden.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  image:
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      # true when manifest.json (in out/ and on the ISO) is signed with the
      # release key; vm-test and publish go by it.
      signed: ${{ steps.check.outputs.signed }}
    env:
      VERSION: ${{ needs.go.outputs.version }}
      CHANNEL: ${{ needs.go.outputs.channel }}
      # The package cache and the build tree (pacstrap base, rootfs overlay,
      # stage) take tens of GB: they go on the runner's second disk.
      SCRATCH: /mnt/vos
      # Whether this build signs: pushes do, once the secret exists. Only the
      # yes/no is here; the key itself goes to the one step that builds.
      SIGN: ${{ github.event_name == 'push' && secrets.VOS_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h / /mnt || true
          # Toolchains this job never uses.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium
          # Docker's storage moves to /mnt as well.
          sudo systemctl stop docker.service docker.socket
          sudo python3 - <<'EOF'
          import json
          path = "/etc/docker/daemon.json"
          try:
              with open(path) as f:
                  conf = json.load(f)
          except (OSError, ValueError):
              conf = {}
          conf["data-root"] = "/mnt/docker"
          with open(path, "w") as f:
              json.dump(conf, f, indent=2)
          EOF
          sudo rm -rf /var/lib/docker
          sudo systemctl start docker.service
          docker info --format 'docker data-root: {{.DockerRootDir}}'
          sudo mkdir -p "$SCRATCH/pkgcache" "$SCRATCH/work"
          sudo chown -R "$(id -u):$(id -g)" "$SCRATCH"
          df -h / "$SCRATCH"

      - uses: actions/download-artifact@v8
        with:
          name: vos
          path: .build

      - name: Check vos
        run: |
          # Artifacts do not keep file modes.
          chmod +x .build/vos
          .build/vos version

      - uses: docker/setup-buildx-action@v4

      - name: Build the builder image
        uses: docker/build-push-action@v7
        with:
          context: build
          file: build/Dockerfile
          platforms: linux/amd64
          tags: vos-builder:ci
          load: true
          pull: true
          cache-from: type=gha,scope=vos-builder
          cache-to: type=gha,mode=max,scope=vos-builder

      # Weekly keys: packages.txt rarely changes, but the repos do, and an
      # exact cache hit is never saved again. A new key each week keeps the
      # cache close to the current repos at the cost of one save a week.
      - name: Package cache key
        id: pkgkey
        run: echo "week=$(date -u +%G-W%V)" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ env.SCRATCH }}/pkgcache
          key: pacman-${{ hashFiles('packages.txt', 'build/pacman.conf') }}-${{ steps.pkgkey.outputs.week }}
          restore-keys: |
            pacman-${{ hashFiles('packages.txt', 'build/pacman.conf') }}-
            pacman-

      - name: Build the image
        env:
          VOS_DEBUG: '0'
          COMPRESS: zstd
          GIT: ${{ github.sha }}
          # The release key, on pushes only: pull requests (from forks, too)
          # never see it. build.sh signs manifest.json with it before making
          # the ISO, checks the signature against keys/release.pub, and keeps
          # the key from everything but `vos sign`.
          VOS_SIGNING_KEY: ${{ github.event_name == 'push' && secrets.VOS_SIGNING_KEY || '' }}
        run: |
          mkdir -p out
          sign=()
          if [ "$SIGN" = true ]; then
            if [ ! -f keys/release.pub ]; then
              echo "::error file=keys/release.pub::keys/release.pub is missing: the signature could not be checked, and the image would trust no release key. Commit the public half of VOS_SIGNING_KEY there."
              exit 1
            fi
            # By name only: the value never appears on a command line.
            sign=(-e VOS_SIGNING_KEY)
          fi
          # As scripts/build.sh runs it, but with the package cache and the
          # build tree in host directories on the big disk instead of volumes.
          docker run --rm --privileged --platform linux/amd64 \
            -v "$PWD:/src:ro" \
            -v "$PWD/out:/out" \
            -v "$SCRATCH/pkgcache:/var/cache/pacman/pkg" \
            -v "$SCRATCH/work:/work" \
            -e VERSION -e CHANNEL -e GIT -e VOS_DEBUG -e COMPRESS -e REFRESH "${sign[@]}" \
            vos-builder:ci /src/build/build.sh
          ls -l out

      - name: Check the output
        id: check
        run: |
          iso=out/vaporos-$VERSION.iso
          [ -s "$iso" ] || { echo "::error::the build produced no $iso"; exit 1; }
          # The manifest must describe this build, and its checksums the files
          # next to it: this is what was signed, and what publish pushes.
          python3 - "$VERSION" "$CHANNEL" "$GITHUB_SHA" <<'EOF'
          import hashlib, json, os, sys
          version, channel, git = sys.argv[1:]
          with open("out/manifest.json") as f:
              m = json.load(f)
          errors = []
          want = {"schema": 1, "product": "vaporos", "version": version, "channel": channel}
          for key, value in want.items():
              if m.get(key) != value:
                  errors.append(f"{key} is {m.get(key)!r}, expected {value!r}")
          if m.get("git") != git:
              print(f"::warning file=out/manifest.json::git is {m.get('git')!r}, expected {git!r}")
          for role in ("root", "kernel", "initrd"):
              a = (m.get("artifacts") or {}).get(role) or {}
              path = os.path.join("out", a.get("name") or f"<no artifacts.{role}.name>")
              if not os.path.isfile(path):
                  errors.append(f"artifacts.{role}: no file {path}")
                  continue
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for block in iter(lambda: f.read(1 << 20), b""):
                      h.update(block)
              if os.path.getsize(path) != a.get("size") or h.hexdigest() != a.get("sha256"):
                  errors.append(f"{path} does not match its size/sha256 in the manifest")
          for e in errors:
              print(f"::error file=out/manifest.json::{e}")
          sys.exit(1 if errors else 0)
          EOF
          # Signed exactly when the build had the key.
          if [ -s out/manifest.json.sig ]; then signed=true; else signed=false; fi
          if [ "$signed" != "$SIGN" ]; then
            if [ "$SIGN" = true ]; then
              echo "::error::the build had the signing key but wrote no manifest.json.sig"
            else
              echo "::error::there is an out/manifest.json.sig, but this build had no signing key"
            fi
            exit 1
          fi
          echo "signed=$signed" >>"$GITHUB_OUTPUT"
          # The live medium must carry this very manifest, and its signature:
          # the installer reads and verifies /vos/manifest.json(.sig) there.
          files=(manifest.json)
          [ "$signed" = false ] || files+=(manifest.json.sig)
          extract=()
          for f in "${files[@]}"; do extract+=(-extract "/vos/$f" "/x/$f"); done
          mkdir -p "$RUNNER_TEMP/iso"
          if ! docker run --rm -v "$PWD/out:/out:ro" -v "$RUNNER_TEMP/iso:/x" vos-builder:ci \
              xorriso -osirrox on -indev "/out/${iso#out/}" "${extract[@]}" >"$RUNNER_TEMP/xorriso.log" 2>&1; then
            cat "$RUNNER_TEMP/xorriso.log"
            echo "::error::could not read ${files[*]} from /vos on the ISO"
            exit 1
          fi
          for f in "${files[@]}"; do
            if ! cmp "out/$f" "$RUNNER_TEMP/iso/$f"; then
              echo "::error::/vos/$f on the ISO differs from out/$f"
              exit 1
            fi
          done
          if [ "$signed" = true ]; then
            echo "Signed with the release key; the ISO carries the signature." >>"$GITHUB_STEP_SUMMARY"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "**Unsigned**: the VOS_SIGNING_KEY secret is not set. The installer refuses this ISO, and it is not published." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "**Unsigned** ($GITHUB_EVENT_NAME build): the installer refuses this ISO, and it is not published." >>"$GITHUB_STEP_SUMMARY"
          fi
          size=$(stat -c %s "$iso")
          {
            echo "| file | size |"
            echo "| --- | ---: |"
            for f in out/*; do
              printf '| %s | %s |\n' "${f#out/}" "$(numfmt --to=iec-i --suffix=B "$(stat -c %s "$f")")"
            done
          } >>"$GITHUB_STEP_SUMMARY"
          # GitHub refuses release assets of 2 GiB or more; keep a margin.
          if [ "$size" -ge 2093796556 ]; then
            echo "::error::the ISO is $(numfmt --to=iec-i --suffix=B "$size"); it must stay under 1.95 GiB to be a release asset"
            exit 1
          fi

      - name: Trim the package cache
        run: |
          # pacman ran as root in the container; actions/cache saves as us.
          sudo chown -R "$(id -u):$(id -g)" "$SCRATCH/pkgcache"
          # Leftover download directories, and every package this build did
          # not install, so the cache holds exactly the current package set.
          find "$SCRATCH/pkgcache" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          db=$SCRATCH/work/base/var/lib/pacman/local
          if [ -d "$db" ]; then
            for f in "$SCRATCH"/pkgcache/*.pkg.tar.*; do
              [ -e "$f" ] || continue
              id=$(basename "$f")
              id=${id%-*.pkg.tar.*}
              [ -d "$db/$id" ] || rm -f "$f"
            done
          else
            echo "::warning::no package database at $db; the package cache is saved untrimmed"
          fi
          du -sh "$SCRATCH/pkgcache"

      - name: Upload the ISO
        uses: actions/upload-artifact@v7
        with:
          name: iso
          # The manifest and, when signed, manifest.json.sig come along.
          path: |
            out/vaporos-${{ env.VERSION }}.iso
            out/manifest.json*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload the OS files
        uses: actions/upload-artifact@v7
        with:
          name: os
          path: |
            out/
            !out/*.iso
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  vm-test:
    needs: [go, image]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.go.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: iso
          path: out

      - name: Enable KVM
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "accel=kvm" >>"$GITHUB_OUTPUT"
          else
            echo "::warning title=No KVM::this runner has no usable /dev/kvm, so the VM test runs under TCG emulation; it may time out, and does not fail the build"
            echo "accel=tcg" >>"$GITHUB_OUTPUT"
          fi

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf >/dev/null
          qemu-system-x86_64 --version

      - name: Install the ISO through the web installer and boot it
        continue-on-error: ${{ steps.kvm.outputs.accel != 'kvm' }}
        env:
          ACCEL: ${{ steps.kvm.outputs.accel }}
          # The installer only installs a signed image. An unsigned ISO (pull
          # requests; pushes before the secret exists) is tested up to that
          # refusal. A branch's push build tests the full install.
          SIGNED: ${{ needs.image.outputs.signed == 'true' && '1' || '0' }}
        run: bash tests/qemu-smoke.sh "out/vaporos-$VERSION.iso" "$VERSION" vm-smoke

      - name: Upload the VM logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vm-smoke
          path: |
            vm-smoke/*.log
            vm-smoke/screens/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [go, image]
    if: github.event_name == 'push'
    # One publish per version at a time: a commit pushed to two branches at
    # once is two builds of one version, and the second must see what the
    # first published (see "Check who owns ..." below).
    concurrency:
      group: publish-${{ needs.go.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.go.outputs.version }}
      CHANNEL: ${{ needs.go.outputs.channel }}
      SIGNED: ${{ needs.image.outputs.signed }}
    steps:
      # A push is built unsigned only when the secret is missing (with the
      # secret, an unsigned build fails the image job). The key never comes
      # here: publish pushes what the image job signed, after checking it.
      - name: Check that the build is signed
        id: gate
        run: |
          if [ "$SIGNED" != true ]; then
            echo "::notice title=Not published::the VOS_SIGNING_KEY secret is not set (or not available to this run), so $VERSION was built unsigned and is not published. Create a key pair with 'vos keygen --out release', commit release.pub as keys/release.pub and store the private key with 'gh secret set VOS_SIGNING_KEY <release.key'."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          # For the release notes.
          fetch-depth: 30

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: vos
          path: .build

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: iso
          path: out

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: os
          path: out

      # A release that installed systems do not trust would be refused by
      # every one of them, so check it before publishing anything.
      - name: Check the signed manifest
        if: steps.gate.outputs.enabled == 'true'
        run: |
          chmod +x .build/vos
          if [ ! -s out/manifest.json.sig ] || [ ! -f keys/release.pub ]; then
            echo "::error::publishing needs out/manifest.json.sig from the image job and keys/release.pub"
            exit 1
          fi
          # As a device checks it: `vos update` accepts a manifest signed by
          # one of the keys in /usr/lib/vos/keys, here keys/release.pub alone.
          sudo rm -rf /usr/lib/vos/keys
          sudo install -Dm0644 keys/release.pub /usr/lib/vos/keys/release.pub
          # (--json-progress: the result as JSON on stdout.)
          if ! .build/vos update --check --json-progress --from out >"$RUNNER_TEMP/check.json"; then
            echo "::error::out/manifest.json.sig does not verify against keys/release.pub"
            exit 1
          fi
          cat "$RUNNER_TEMP/check.json"
          if ! jq -e --arg v "$VERSION" '.offered == $v' "$RUNNER_TEMP/check.json" >/dev/null; then
            echo "::error::vos update reads version $(jq -r .offered "$RUNNER_TEMP/check.json") from out/, not $VERSION"
            exit 1
          fi
          # And without the Go code that made the signature: openssl.
          . build/lib.sh
          if ! verify_ed25519 keys/release.pub out/manifest.json out/manifest.json.sig; then
            echo "::error::openssl does not verify out/manifest.json.sig against keys/release.pub"
            exit 1
          fi
          # It is this build's manifest...
          if ! jq -e --arg v "$VERSION" --arg c "$CHANNEL" --arg g "$GITHUB_SHA" \
              '.version == $v and .channel == $c and .git == $g' out/manifest.json >/dev/null; then
            echo "::error file=out/manifest.json::the signed manifest is not the one of $VERSION ($CHANNEL) at $GITHUB_SHA"
            exit 1
          fi
          # ...and it describes the files about to be pushed.
          cd out
          jq -r '.artifacts | .root, .kernel, .initrd | "\(.sha256)  \(.name)"' manifest.json |
            sha256sum --check --strict

      - name: Checksums
        if: steps.gate.outputs.enabled == 'true'
        working-directory: out
        run: |
          sha256sum "vaporos-$VERSION.iso" manifest.json manifest.json.sig >SHA256SUMS
          cat SHA256SUMS

      # The version is the commit's time, so a commit pushed to two branches
      # (a new branch before its first commit, a fast-forward into main) is
      # built once per channel under one version. The channel tag always
      # moves. The version tag and the release v<version> stay with the
      # channel that published them first, except that main takes them over,
      # since main's releases are the ones people install; a re-run refreshes
      # its own.
      - name: Check who owns v${{ env.VERSION }}
        id: owner
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            owner=$CHANNEL # nobody yet
          else
            # The channel in the release's own manifest.json. When that cannot
            # be read, leave the release alone.
            owner=$(gh release download "v$VERSION" --pattern manifest.json --output - 2>/dev/null |
              jq -r '.channel // empty' 2>/dev/null) || owner=
            owner=${owner:-an unknown channel}
          fi
          echo "owner=$owner" >>"$GITHUB_OUTPUT"
          if [ "$owner" = "$CHANNEL" ] || [ "$GITHUB_REF_NAME" = main ]; then
            echo "version=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice title=Channel tag only::v$VERSION (this commit) is already released from $owner. This build only moves the '$CHANNEL' tag on ghcr.io, and leaves the version tag and the release alone."
            echo "version=false" >>"$GITHUB_OUTPUT"
          fi

      - uses: oras-project/setup-oras@v2
        if: steps.gate.outputs.enabled == 'true'

      - name: Push the OS to ghcr.io
        if: steps.gate.outputs.enabled == 'true'
        working-directory: out
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          OWNS_VERSION: ${{ steps.owner.outputs.version }}
        run: |
          # ghcr.io wants the repository in lower case.
          repo=ghcr.io/${GITHUB_REPOSITORY,,}
          tags=$CHANNEL
          if [ "$OWNS_VERSION" = true ]; then tags=$VERSION,$CHANNEL; fi
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # oras records each file's name as its org.opencontainers.image.title
          # annotation, which is how `vos update` finds the files.
          oras push "$repo:$tags" \
            --artifact-type application/vnd.vaporos.os.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            manifest.json:application/vnd.vaporos.manifest.v1+json \
            manifest.json.sig:application/vnd.vaporos.manifest.signature.v1 \
            root.erofs:application/vnd.vaporos.root.v1.erofs \
            vmlinuz:application/vnd.vaporos.kernel.v1 \
            initramfs.img:application/vnd.vaporos.initrd.v1
          summary=
          for t in ${tags//,/ }; do summary+="${summary:+, }\`$repo:$t\`"; done
          echo "OCI: $summary" >>"$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        if: steps.gate.outputs.enabled == 'true' && steps.owner.outputs.version == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          tag=v$VERSION
          repo=ghcr.io/${GITHUB_REPOSITORY,,}
          {
            echo "VaporOS $VERSION, built from \`$CHANNEL\` at $GITHUB_SHA."
            echo
            echo "- **Install:** write \`vaporos-$VERSION.iso\` to a USB stick and boot it in UEFI mode."
            echo "- **Update:** machines on the \`$CHANNEL\` channel pull \`$repo:$CHANNEL\`."
            echo
            echo "### Recent commits"
            git log -n 15 --no-merges --format='- %h %s' "$GITHUB_SHA"
          } >"$RUNNER_TEMP/notes.md"
          files=("out/vaporos-$VERSION.iso" out/manifest.json out/manifest.json.sig out/SHA256SUMS)
          if [ "$GITHUB_REF_NAME" = main ]; then
            kind=(--latest)
          else
            kind=(--prerelease --latest=false)
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "${files[@]}" "${kind[@]}" \
              --target "$GITHUB_SHA" \
              --title "VaporOS $VERSION ($CHANNEL)" \
              --notes-file "$RUNNER_TEMP/notes.md"
          elif [ "$OWNER" = "$CHANNEL" ]; then
            # A re-run of this job: refresh the assets of the existing release.
            gh release upload "$tag" "${files[@]}" --clobber
          else
            # main taking over a branch's prerelease of the same commit.
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --prerelease=false --latest \
              --title "VaporOS $VERSION ($CHANNEL)" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >>"$GITHUB_STEP_SUMMARY"
