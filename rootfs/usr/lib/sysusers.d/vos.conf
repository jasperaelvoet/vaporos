# The gaming user. gamescope, Steam, Sunshine and PipeWire run as vapor's user
# units; it lingers (see tmpfiles.d/vos.conf), so they start at boot without a
# login. It has no password: nobody logs in as vapor.
#   input  uinput/uhid, for Sunshine's virtual keyboard, mouse and gamepads
#   render, video  the GPU
#   seat   seatd's socket, through which gamescope opens the DRM device
#   audio  /dev/snd, since a lingering user has no seat session to grant it
g vapor 1000
u vapor 1000:vapor "VaporOS" /var/home/vapor /usr/bin/bash
m vapor input
m vapor render
m vapor video
m vapor seat
m vapor audio
