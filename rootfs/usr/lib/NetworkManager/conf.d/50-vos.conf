# NetworkManager rather than networkd, because Steam's SteamOS first-run setup
# and its network settings list and join networks over NM's D-Bus API.
# See docs/CONTRACTS.md "Network". No connectivity check: NM never phones home.

[main]
dns=systemd-resolved
# vosd owns /etc/hostname (Settings, and the installer).
hostname-mode=none

[device]
wifi.backend=iwd

[connection]
# Identify by MAC, not by the machine-id-derived DUID: the live installer and
# the installed system then get the same address, which the installer's
# "restarting" page and the welcome screen have already shown the user.
ipv4.dhcp-client-id=mac
# 50-vos-wol.link (udev) sets WakeOnLan=magic; NM must not undo it.
ethernet.wake-on-lan=ignore

[connection-wired]
match-device=type:ethernet
ipv4.route-metric=100

[connection-wifi]
match-device=type:wifi
ipv4.route-metric=600
