# No keypress reboots VaporOS. Every keyboard feeds the kernel's console
# keyboard, a Moonlight client's too (through Sunshine's virtual keyboard), and
# nothing puts it in K_OFF, so Ctrl+Alt+Del reaches systemd. ctrl-alt-del.target
# is masked (build/build.sh); this stops seven presses within two seconds from
# forcing a reboot anyway. Reboots go through the web UI.
[Manager]
CtrlAltDelBurstAction=none
# A trial boot (an OS update, or a new extension set) that hangs the kernel
# or PID 1 must still reboot, so it uses up a try instead of hanging for
# good. A no-op without a hardware watchdog.
RuntimeWatchdogSec=60s
