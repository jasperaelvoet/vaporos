# gamescope reaches the GPU through seatd (LIBSEAT_BACKEND=seatd), as the
# vapor user, which is in the seat group. There is no VT to bind the seat to:
# VaporOS runs no gettys, and a VT-bound seat would be suspended whenever the
# kernel's console switched away from it.
[Service]
Environment=SEATD_VTBOUND=0
ExecStart=
ExecStart=/usr/bin/seatd -g seat
