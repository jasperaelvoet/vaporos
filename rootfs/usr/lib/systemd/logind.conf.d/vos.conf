# No virtual terminals: nothing may ever put a login prompt on a screen. The
# display belongs to the welcome screen and gamescope.
[Login]
NAutoVTs=0
ReserveVT=0
# logind watches every keyboard for the reboot, suspend and hibernate keys, a
# Moonlight client's too (through Sunshine's virtual keyboard): a sleep key on
# the client would suspend the box mid-stream. Power is the web UI's job, and
# idle shutdown's. The case's power button still shuts it down cleanly.
HandleRebootKey=ignore
HandleRebootKeyLongPress=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
