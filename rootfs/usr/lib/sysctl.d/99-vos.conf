# No Magic SysRq from a keyboard: Alt+SysRq+B (reboot), +C (crash) and +O (off)
# work from any keyboard, Sunshine's virtual one included, whatever the console
# keyboard mode. cachyos-settings (70-cachyos-settings.conf) turns it on; this
# file sorts after it. Writes to /proc/sysrq-trigger (the initramfs hook's
# last-resort reboot) do not depend on this setting.
kernel.sysrq = 0
