# The image ships an empty /var: it lives on the data partition and is filled
# in here, per machine. These are the directories that the top-level symlinks
# (/home, /root, /srv, /opt, /usr/local) point into.
d /var/home          0755 root root -
d /var/roothome      0700 root root -
d /var/srv           0755 root root -
d /var/opt           0755 root root -
d /var/usrlocal      0755 root root -
d /var/usrlocal/bin  0755 root root -
d /var/usrlocal/lib  0755 root root -
d /var/usrlocal/share 0755 root root -

# sshd privilege separation directory, normally shipped in /var by openssh.
d /var/empty         0755 root root -
