# The image ships an empty /var: it lives on the data partition and is filled
# in here, per machine. These are the directories that the top-level symlinks
# (/home, /root, /srv, /opt, /mnt, /usr/local) point into.
d /var/home          0755 root root -
d /var/roothome      0700 root root -
d /var/srv           0755 root root -
d /var/opt           0755 root root -
d /var/mnt           0755 root root -
d /var/usrlocal      0755 root root -
d /var/usrlocal/bin  0755 root root -
d /var/usrlocal/lib  0755 root root -
d /var/usrlocal/share 0755 root root -

# sshd privilege separation directory, normally shipped in /var by openssh.
d /var/empty         0755 root root -

# vosd's state: config.json, auth.json, update-state.json, ... and the EDID
# with learned modes (firmware_class.path=/var/lib/vos/firmware).
d /var/lib/vos                  0755 root root -
d /var/lib/vos/firmware         0755 root root -
d /var/lib/vos/firmware/edid    0755 root root -
# Runtime state: session.sock, welcome.json. (The live ISO's medium is also
# mounted below /run/vos, by the initramfs.)
d /run/vos                      0755 root root -

# The gaming user's home, and linger, so its user manager (PipeWire,
# gamescope, Sunshine) starts at boot without anyone logging in.
d /var/home/vapor               0700 vapor vapor -
d /var/lib/systemd/linger       0755 root root -
f /var/lib/systemd/linger/vapor 0644 root root -
