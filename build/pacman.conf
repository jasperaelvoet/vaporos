# pacman configuration used by pacstrap to assemble the OS image.
#
# The image is CachyOS on top of Arch: the CachyOS repos come first, so every
# package they rebuild (glibc, systemd, ...) is taken from them, compiled
# for x86-64-v3. Arch fills in the rest. x86-64-v3 means the image
# needs a Haswell (2013) / Zen or newer CPU; the dev VM uses `--cpu host`.

[options]
HoldPkg     = pacman glibc
Architecture = x86_64 x86_64_v3
CheckSpace
ParallelDownloads = 10
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# See build/Dockerfile: seccomp sandboxing fails under x86_64 translation.
DisableSandbox

# The linux package would otherwise trigger a full `mkinitcpio -P` (default and
# fallback images, with autodetect) during pacstrap. We build our own initramfs
# once, later, so skip the hook and save the time.
NoExtract   = usr/share/libalpm/hooks/90-mkinitcpio-install.hook

# Docs nobody reads on an appliance-style image.
NoExtract   = usr/share/doc/* usr/share/gtk-doc/* usr/share/help/*
NoExtract   = usr/share/man/* usr/share/info/*
# Message translations: nothing on VaporOS shows a desktop UI, and every byte
# counts against the ISO's 2 GiB release-asset limit. English stays, and so
# does glibc's locale.alias. (Steam and Sunshine ship their own translations
# elsewhere; locale definitions for locale-gen live in usr/share/i18n.)
NoExtract   = usr/share/locale/* !usr/share/locale/en* !usr/share/locale/locale.alias

[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

# Generic x86-64 CachyOS packages: linux-cachyos, cachyos-settings, ...
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# 32-bit libraries for Steam and the games it runs (lib32-mesa, ...), and the
# steam package itself.
[multilib]
Include = /etc/pacman.d/mirrorlist
